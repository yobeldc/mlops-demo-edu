name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-to-cml:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      # -------------------------------------------------
      # 1. GET PROJECT
      # -------------------------------------------------
      - name: Get Project ID
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
          CDSW_DOMAIN: "https://ml-c2658fe4-6d5.mariapg.kfjr-x0dh.cloudera.site"
          PROJ_NAME: "cicd-yobel"
        run: |
          set -e

          RESPONSE=$(curl -sS \
            -X GET \
            "$CDSW_DOMAIN/api/v2/projects?search_filter=%7B%22name%22%3A%22$PROJ_NAME%22%7D" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $API_KEY")

          echo "Project search response:"
          echo "$RESPONSE" | jq .

          PROJECT_ID=$(echo "$RESPONSE" | jq -r '.projects[0].id // empty')

          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: Project '$PROJ_NAME' was not found."
            exit 1
          fi

          echo "Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      # -------------------------------------------------
      # 2. CHECK RUNTIME
      # -------------------------------------------------
      - name: Check Available CML Runtimes
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
          CDSW_DOMAIN: "https://ml-c2658fe4-6d5.mariapg.kfjr-x0dh.cloudera.site"
        run: |
          set -e

          echo "Available Python runtimes:"

          curl -sS \
            -X GET \
            "$CDSW_DOMAIN/api/v2/runtimes?page_size=100" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
          | jq -r '.runtimes[] |
              select(.kernel | ascii_downcase | contains("python")) |
              .image_identifier'

      # -------------------------------------------------
      # 3. CREATE BOOTSTRAP JOB
      # -------------------------------------------------
      - name: Create Bootstrap Job
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
          CDSW_DOMAIN: "https://ml-c2658fe4-6d5.mariapg.kfjr-x0dh.cloudera.site"
          PROJECT_ID: ${{ env.PROJECT_ID }}
          RUN_TIME: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-workbench-python3.9-standard:2024.02.1-b4"
        run: |
          set -e

          PAYLOAD=$(jq -n \
            --arg runtime "$RUN_TIME" \
            '{
              cpu: 2,
              memory: 4,
              name: "bootstrap",
              runtime_identifier: $runtime,
              script: "0_bootstrap.py"
            }')

          echo "Creating bootstrap job..."

          RESPONSE=$(curl -sS \
            -X POST \
            "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Create job response:"
          echo "$RESPONSE" | jq .

          JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$JOB_ID" ]; then
            echo "ERROR: CML failed to create bootstrap job."
            exit 1
          fi

          echo "Bootstrap Job ID: $JOB_ID"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

          echo "Starting bootstrap job..."

          RUN_RESPONSE=$(curl -sS \
            -X POST \
            "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$JOB_ID/runs" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Bootstrap run response:"
          echo "$RUN_RESPONSE" | jq .

      # -------------------------------------------------
      # 4. TEMPORARY WAIT
      # -------------------------------------------------
      - name: Wait for 30 Seconds
        run: sleep 30

      # -------------------------------------------------
      # 5. CREATE TRAINING JOB
      # -------------------------------------------------
      - name: Create and Execute Fit Model Job
        env:
          API_KEY: ${{ secrets.CML_API_KEY }}
          CDSW_DOMAIN: "https://ml-c2658fe4-6d5.mariapg.kfjr-x0dh.cloudera.site"
          PROJECT_ID: ${{ env.PROJECT_ID }}
          RUN_TIME: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-workbench-python3.9-standard:2024.02.1-b4"
        run: |
          set -e

          PAYLOAD=$(jq -n \
            --arg runtime "$RUN_TIME" \
            '{
              cpu: 2,
              memory: 4,
              name: "train_experiment",
              runtime_identifier: $runtime,
              script: "fit.py"
            }')

          RESPONSE=$(curl -sS \
            -X POST \
            "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Create experiment job response:"
          echo "$RESPONSE" | jq .

          EXPERIMENT_JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')

          if [ -z "$EXPERIMENT_JOB_ID" ]; then
            echo "ERROR: CML failed to create experiment job."
            exit 1
          fi

          echo "Experiment Job ID: $EXPERIMENT_JOB_ID"

          RUN_RESPONSE=$(curl -sS \
            -X POST \
            "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$EXPERIMENT_JOB_ID/runs" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Experiment run response:"
          echo "$RUN_RESPONSE" | jq .
