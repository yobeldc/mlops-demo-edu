name: CI/CD Pipeline
on:
  push:
    branches:
      - main

env:
  CDSW_DOMAIN: "https://ml-c2658fe4-6d5.mariapg.kfjr-x0dh.cloudera.site"
  PROJ_NAME: "cicd-yobel"
  RUN_TIME: "docker.repository.cloudera.com/cloudera/cdsw/ml-runtime-workbench-python3.9-standard:2024.02.1-b4"

jobs:
  deploy-to-cml:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get Project ID
        env:
          RAW_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          set -euo pipefail

          API_KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n' | xargs)
          echo "Panjang API key: ${#API_KEY} karakter (harusnya 129)"

          PROJECT_ID=$(curl -sS -G "$CDSW_DOMAIN/api/v2/projects" -H "accept: application/json" -H "Authorization: Bearer $API_KEY" --data-urlencode "search_filter={\"name\":\"$PROJ_NAME\"}" | jq -r '.projects[0].id // empty')

          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Project '$PROJ_NAME' tidak ketemu"
            exit 1
          fi

          echo "Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Create and Run Bootstrap Job
        env:
          RAW_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          set -euo pipefail

          API_KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n' | xargs)

          jq -n --arg rt "$RUN_TIME" '{cpu:2,memory:4,name:"bootstrap",runtime_identifier:$rt,script:"0_bootstrap.py"}' > job.json
          echo "Body: $(cat job.json)"

          RESPONSE=$(curl -sS -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" -H "accept: application/json" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d @job.json)

          echo "Response: $RESPONSE"

          JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$JOB_ID" ]; then
            echo "::error::Gagal membuat job bootstrap — lihat Response di atas"
            exit 1
          fi

          echo "Job ID: $JOB_ID"

          RUN=$(curl -sS -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$JOB_ID/runs" -H "accept: application/json" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json")

          echo "Run response: $RUN"
          echo "$RUN" | jq -e '.id' > /dev/null || { echo "::error::Gagal trigger run bootstrap"; exit 1; }

      - name: Wait for 30 Seconds
        run: sleep 30

      - name: Create and Run Fit Model Job
        env:
          RAW_KEY: ${{ secrets.CML_API_KEY }}
        run: |
          set -euo pipefail

          API_KEY=$(printf '%s' "$RAW_KEY" | tr -d '\r\n' | xargs)

          jq -n --arg rt "$RUN_TIME" '{cpu:2,memory:4,name:"train_experiment",runtime_identifier:$rt,script:"fit.py"}' > job.json
          echo "Body: $(cat job.json)"

          RESPONSE=$(curl -sS -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs" -H "accept: application/json" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" -d @job.json)

          echo "Response: $RESPONSE"

          JOB_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          if [ -z "$JOB_ID" ]; then
            echo "::error::Gagal membuat job train_experiment — lihat Response di atas"
            exit 1
          fi

          echo "Experiment Job ID: $JOB_ID"

          RUN=$(curl -sS -X POST "$CDSW_DOMAIN/api/v2/projects/$PROJECT_ID/jobs/$JOB_ID/runs" -H "accept: application/json" -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json")

          echo "Run response: $RUN"
          echo "$RUN" | jq -e '.id' > /dev/null || { echo "::error::Gagal trigger run train_experiment"; exit 1; }
